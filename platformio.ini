; ---------------------------------------------------------------------
; Entorno del firmware real (ESP32-S3 N16R8)
; ---------------------------------------------------------------------
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi  ; N16R8: flash+PSRAM octal
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	etherkit/Si5351 @ ^2.1.4

; Nota: timerAttachInterruptArg() es de arduino-esp32 core 2.x.
; Si PlatformIO trae el core 3.x (ESP-IDF 5), la firma de los timers
; cambia (timerAttachInterrupt(timer, &onTimer) sin el argumento).
; Si al compilar tira error en esa linea de main.cpp, es por eso.

; ---------------------------------------------------------------------
; Entorno de tests nativos (corre en la PC, sin ESP32 conectado)
; ---------------------------------------------------------------------
; Solo compila vfo_logic.cpp: es el unico modulo sin dependencias de
; Arduino/FreeRTOS/hardware, por eso es el unico que se puede testear
; sin el equipo en la mesa. encoder.cpp, main.cpp, *_driver.cpp quedan
; afuera a proposito (build_src_filter).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<vfo_logic.cpp>

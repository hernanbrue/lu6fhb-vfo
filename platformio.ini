; ---------------------------------------------------------------------
; Entorno del firmware real (ESP32-S3 N16R8)
; ---------------------------------------------------------------------
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi  ; N16R8: flash+PSRAM octal
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	etherkit/Etherkit Si5351 @ ^2.1.4

; Nota: main.cpp ya no usa el timer de HARDWARE de arduino-esp32
; (timerBegin/timerAttachInterrupt), porque esa API cambia entre el
; core 2.x y el 3.x y rompia el build cada vez que PlatformIO resolvia
; una version distinta. Ahora usa un timer de SOFTWARE de FreeRTOS
; (xTimerCreate), que es identico en cualquier version del core.
; Si en algun momento necesitas precision de microsegundos real
; (no es el caso para un tick de 100ms), ahi si conviene volver a un
; timer de hardware, fijando antes la version exacta del platform.

; ---------------------------------------------------------------------
; Entorno del firmware real (ESP32 clasico - WROOM-32, "38 pines")
; ---------------------------------------------------------------------
; Mismo codigo fuente que env:esp32-s3. config.h detecta el chip solo
; (CONFIG_IDF_TARGET_ESP32S3) y usa el pinout que corresponda - no hay
; nada que editar a mano al cambiar de placa en la mesa.
[env:esp32-classic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit GFX Library @ ^1.11.9
	etherkit/Etherkit Si5351 @ ^2.1.4

; ---------------------------------------------------------------------
; Entorno de tests nativos (corre en la PC, sin ESP32 conectado)
; ---------------------------------------------------------------------
; Solo compila vfo_logic.cpp: es el unico modulo sin dependencias de
; Arduino/FreeRTOS/hardware, por eso es el unico que se puede testear
; sin el equipo en la mesa. encoder.cpp, main.cpp, *_driver.cpp quedan
; afuera a proposito (build_src_filter).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<vfo_logic.cpp>